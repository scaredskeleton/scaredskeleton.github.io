<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Cedric's Portfolio Website" />
		<meta property="og:title" content="Cedric Aguila" />
		<meta property="og:description" content="Experienced Game Developer" />
		<meta property="og:image" content="%sveltekit.assets%/images/banner.png" />
		<link rel="icon" href="%sveltekit.assets%/images/logo.jpg" type="image/jpg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,400;1,700&family=Share+Tech+Mono&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background-color: rgb(30, 30, 30)">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
